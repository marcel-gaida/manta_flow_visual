<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Manta Flow Visual</title>
		<!-- D3.js for original visualization -->
		<script src="https://d3js.org/d3.v4.min.js"></script>
		<!-- Tailwind CSS for new visualization styling -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- React Libraries for new visualization -->
		<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
		<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
		<!-- Babel to transpile JSX in the browser -->
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<!-- Recharts for charts -->
		<script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
			body {
				font-family: 'Inter', sans-serif;
				background-color: #111827; /* bg-gray-900 */
				color: #E5E7EB; /* text-gray-200 */
			}
			/* Styling for original D3 chart */
			.grid .tick {
				stroke: lightgrey;
				opacity: 0.1;
			}
			.grid path {
				stroke-width: 0;
			}
			h1 {
				font-size: 1.5rem;
				text-align: center;
				margin: 1rem;
			}
		</style>
	</head>
	<body>
		<!-- Container for the original Mantaflow visualization -->
		<h1>Manta Flow Performance</h1>
		<div id="my_dataviz"></div>

		<!-- Container for the new Air Quality visualization -->
		<div id="air-quality-viz-container" class="mt-16"></div>

		<!-- Script for the original Mantaflow D3.js chart -->
		<script>
			// set the dimensions and margins of the graph
			var margin = { top: 20, right: 20, bottom: 50, left: 50 },
				width = 960 - margin.left - margin.right,
				height = 500 - margin.top - margin.bottom;

			// parse the date / time
			var parseTime = d3.timeParse("%Y-%m-%d %H:%M:%S");

			// set the ranges
			var x = d3.scaleTime().range([0, width]);
			var y = d3.scaleLinear().range([height, 0]);

			// define the line
			var valueline = d3
				.line()
				.x(function (d) {
					return x(d.date);
				})
				.y(function (d) {
					return y(d.performance);
				});

			// append the svg obgect to the body of the page
			// appends a 'group' element to 'svg'
			// moves the 'group' element to the top left margin
			var svg = d3
				.select("#my_dataviz")
				.append("svg")
				.attr("width", width + margin.left + margin.right)
				.attr("height", height + margin.top + margin.bottom)
				.append("g")
				.attr(
					"transform",
					"translate(" + margin.left + "," + margin.top + ")"
				);

			function make_y_gridlines() {
				return d3.axisLeft(y).ticks(10);
			}

			// get the data
			d3.csv("perf.csv", function (error, data) {
				if (error) throw error;

				// format the data
				data.forEach(function (d) {
					d.date = parseTime(d.date);
					d.performance = +d.performance;
				});

				// Scale the range of the data
				x.domain(
					d3.extent(data, function (d) {
						return d.date;
					})
				);
				y.domain([
					0,
					d3.max(data, function (d) {
						return d.performance;
					}),
				]);

				svg
					.append("g")
					.attr("class", "grid")
					.call(make_y_gridlines().tickSize(-width).tickFormat(""));

				// add the valueline path.
				svg.append("path").data([data]).attr("class", "line").style("fill", "none").style("stroke", "steelblue").style("stroke-width", "2px").attr("d", valueline);

				// add the x Axis
				svg
					.append("g")
					.attr("transform", "translate(0," + height + ")")
					.call(d3.axisBottom(x));

				// add the y Axis
				svg.append("g").call(d3.axisLeft(y));

				svg.append("text")             
					.attr("transform", "translate(" + (width/2) + " ," + (height + margin.top + 20) + ")")
					.style("text-anchor", "middle")
					.style("fill", "white")
					.text("Date");

				svg.append("text")
					.attr("transform", "rotate(-90)")
					.attr("y", 0 - margin.left)
					.attr("x",0 - (height / 2))
					.attr("dy", "1em")
					.style("text-anchor", "middle")
					.style("fill", "white")
					.text("Performance");  
			});
		</script>

		<!-- Script for the new Air Quality React chart -->
		<script type="text/babel">
			const { useState, useEffect } = React;
			const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

			// URL pointing to your data file in the 'main' branch.
			const DATA_URL = 'https://raw.githubusercontent.com/marcel-gaida/manta_flow_visual/main/bin/air_quality_data.json';

			const formatXAxis = (tickItem) => {
				const date = new Date(tickItem);
				return date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
			};

			function AirQualityApp() {
				const [chartData, setChartData] = useState([]);
				const [isLoading, setIsLoading] = useState(true);
				const [error, setError] = useState(null);

				useEffect(() => {
					const fetchData = async () => {
						try {
							const response = await fetch(DATA_URL);
							if (!response.ok) {
								throw new Error(`HTTP error! Status: ${response.status}`);
							}
							const jsonData = await response.json();
							const formattedData = jsonData.map(d => ({
								date: d["Recorded At: Week"],
								aqi: parseFloat(d["Average of Aqi Us"]).toFixed(2),
								tempF: parseFloat(d["Average of Temperature in F"]).toFixed(2),
							}));
							setChartData(formattedData);
						} catch (e) {
							console.error("Failed to fetch or process data:", e);
							setError(e.message);
						} finally {
							setIsLoading(false);
						}
					};
					fetchData();
				}, []);

				if (isLoading) {
					return (
						<div className="text-white min-h-screen p-8 flex justify-center items-center">
							<h2 className="text-2xl text-cyan-400 animate-pulse">Loading Air Quality Data...</h2>
						</div>
					);
				}

				if (error) {
					return (
						<div className="text-white min-h-screen p-8 flex justify-center items-center">
							<div className="bg-red-900/50 border border-red-500 p-6 rounded-lg text-center max-w-lg">
								<h2 className="text-2xl font-bold text-red-300">Error Loading Visualization</h2>
								<p className="mt-2 text-red-200">{error}</p>
							</div>
						</div>
					);
				}

				return (
					<div className="bg-gray-900 text-white p-4 sm:p-6 lg:p-8 flex flex-col items-center">
						<div className="w-full max-w-6xl">
							<header className="text-center mb-8">
								<h1 className="text-3xl sm:text-4xl font-bold text-cyan-400">Weekly Air Quality & Temperature</h1>
							</header>
							<main className="bg-gray-800/50 backdrop-blur-sm border border-gray-700 rounded-2xl shadow-2xl p-4 sm:p-6 lg:p-8 w-full">
								<ResponsiveContainer width="100%" height={500}>
									<LineChart data={chartData} margin={{ top: 5, right: 30, left: 20, bottom: 50 }}>
										<CartesianGrid strokeDasharray="3 3" stroke="#4A5568" />
										<XAxis 
											dataKey="date" 
											tickFormatter={formatXAxis} 
											angle={-45}
											textAnchor="end"
											height={70}
											tick={{ fill: '#A0AEC0' }}
											stroke="#A0AEC0"
											interval="preserveStartEnd"
										/>
										<YAxis yAxisId="left" stroke="#81E6D9" label={{ value: 'US AQI', angle: -90, position: 'insideLeft', fill: '#81E6D9', style: {textAnchor: 'middle'} }} tick={{ fill: '#81E6D9' }} />
										<YAxis yAxisId="right" orientation="right" stroke="#F6AD55" label={{ value: 'Temp (°F)', angle: 90, position: 'insideRight', fill: '#F6AD55', style: {textAnchor: 'middle'} }} tick={{ fill: '#F6AD55' }} />
										<Tooltip 
											contentStyle={{ backgroundColor: '#1A202C', border: '1px solid #2D3748', borderRadius: '0.75rem' }}
											labelStyle={{ color: '#E2E8F0', fontWeight: 'bold' }}
											formatter={(value, name) => [value, name]}
											labelFormatter={(label) => new Date(label).toLocaleDateString()}
										/>
										<Legend wrapperStyle={{ bottom: 0 }}/>
										<Line yAxisId="left" type="monotone" dataKey="aqi" name="AQI (US)" stroke="#81E6D9" strokeWidth={2} dot={false} activeDot={{ r: 8 }} />
										<Line yAxisId="right" type="monotone" dataKey="tempF" name="Temperature (°F)" stroke="#F6AD55" strokeWidth={2} dot={false} activeDot={{ r: 8 }} />
									</LineChart>
								</ResponsiveContainer>
							</main>
						</div>
					</div>
				);
			}

			// Render the React component into its dedicated container.
			const container = document.getElementById('air-quality-viz-container');
			const root = ReactDOM.createRoot(container);
			root.render(<AirQualityApp />);
		</script>
	</body>
</html>
