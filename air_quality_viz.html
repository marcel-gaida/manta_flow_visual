        // This function draws the chart using the provided data.
        function renderChart(jsonData) {
            const labels = jsonData.map(d => {
                const date = new Date(d["Recorded At: Week"]);
                return date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            });
            const aqiData = jsonData.map(d => parseFloat(d["Average of Aqi Us"]).toFixed(2));
            const tempData = jsonData.map(d => parseFloat(d["Average of Temperature in F"]).toFixed(2));

            const data = {
                labels: labels,
                datasets: [{
                    label: 'AQI (US)',
                    data: aqiData,
                    borderColor: '#81E6D9',
                    backgroundColor: 'rgba(129, 230, 217, 0.2)',
                    yAxisID: 'yAqi',
                    tension: 0.1,
                    pointRadius: 0,
                }, {
                    label: 'Temperature (°F)',
                    data: tempData,
                    borderColor: '#F6AD55',
                    backgroundColor: 'rgba(246, 173, 85, 0.2)',
                    yAxisID: 'yTemp',
                    tension: 0.1,
                    pointRadius: 0,
                }]
            };

            const config = {
                type: 'line',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: {
                            ticks: { color: '#A0AEC0' },
                            grid: { color: 'rgba(160, 174, 192, 0.2)' }
                        },
                        yAqi: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'US AQI', color: '#81E6D9' },
                            ticks: { color: '#81E6D9' },
                            grid: { drawOnChartArea: false }
                        },
                        yTemp: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: 'Temp (°F)', color: '#F6AD55' },
                            ticks: { color: '#F6AD55' },
                            grid: { drawOnChartArea: false }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#E2E8F0' } },
                        tooltip: {
                            backgroundColor: '#1A202C',
                            titleColor: '#E2E8F0',
                            bodyColor: '#E2E8F0',
                        }
                    }
                }
            };

            const ctx = document.getElementById('aqiChart').getContext('2d');
            new Chart(ctx, config);
        }

        // This function initializes the page. It tries to fetch live data
        // and falls back to placeholder data on failure.
        async function initializePage() {
            const statusElement = document.getElementById('data-status');
            const dataUrl = './bin/air_quality_data.json';
            
            try {
                const response = await fetch(dataUrl);
                if (!response.ok) {
                    // This will trigger the catch block if the file is not found (e.g., 404)
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const liveData = await response.json();
                renderChart(liveData);
                statusElement.textContent = 'Live data loaded successfully.';
                statusElement.style.color = '#81E6D9'; // Cyan for success
            } catch (error) {
                console.error("Could not load live data:", error);
                renderChart(placeholderJsonData); // Use embedded data as a fallback
                statusElement.textContent = 'Failed to load live data. Displaying placeholder data.';
                statusElement.style.color = '#F6AD55'; // Orange for fallback
            }
        }

        // Run the initializer function once the DOM is fully loaded.
        document.addEventListener('DOMContentLoaded', initializePage);
